<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابي | Nova</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070b14;
            --bg-card: rgba(255, 255, 255, 0.04);
            --gold-accent: #d4af37;
            --blue-accent: #3b82f6;
            --success: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 40%);
            min-height: 100vh;
        }

        /* Top Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(7, 11, 20, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--gold-accent);
            text-decoration: none;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 5px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover { background: #ef4444; color: white; }

        /* Main Dashboard Layout */
        .dashboard-container {
            padding: 40px 5%;
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 30px;
        }

        /* Sidebar / Wallet Widget */
        .wallet-widget {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .wallet-icon {
            font-size: 3rem;
            color: var(--gold-accent);
            margin-bottom: 15px;
        }

        .balance-title { color: var(--text-muted); font-size: 1rem; }
        .balance-amount { font-size: 2.5rem; font-weight: 800; margin: 10px 0; color: white; }
        .balance-amount span { font-size: 1.2rem; color: var(--success); }

        .btn-deposit {
            width: 100%;
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Main Content */
        .content-area h2 { margin-bottom: 25px; border-bottom: 1px solid var(--border-glass); padding-bottom: 10px; }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 15px;
            padding: 25px;
            transition: 0.3s;
        }

        .service-card:hover { border-color: var(--blue-accent); transform: translateY(-5px); }

        .service-card h3 { color: var(--blue-accent); margin-bottom: 10px; }
        .service-price { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; }

        .btn-buy {
            width: 100%;
            background: transparent;
            color: white;
            border: 1px solid var(--blue-accent);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-buy:hover { background: var(--blue-accent); }

        @media (max-width: 768px) {
            .dashboard-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="#" class="logo">NOVA</a>
        <div class="user-info">
            <span>مرحباً، المستخدم</span>
            <button class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Wallet Sidebar -->
        <aside class="wallet-widget">
            <i class="fa-solid fa-wallet wallet-icon"></i>
            <div class="balance-title">الرصيد المتاح</div>
            <div class="balance-amount">$0.00 <span>USDT</span></div>
            <button class="btn-deposit" onclick="alert('سيتم فتح نافذة الإيداع وعرض عنوان محفظة TRC20')">
                <i class="fa-brands fa-bitcoin"></i> إيداع USDT
            </button>
        </aside>

        <!-- Services Area -->
        <main class="content-area">
            <h2>شراء الاشتراكات</h2>
            <div class="services-grid">
                
                <div class="service-card">
                    <h3>ChatGPT Plus</h3>
                    <div class="service-price">$10 <span>/ شهر</span></div>
                    <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem;">يتم خصم المبلغ من رصيد المحفظة وتفعيل الاشتراك فوراً.</p>
                    <button class="btn-buy">شراء الآن</button>
                </div>

                <div class="service-card" style="border-color: var(--gold-accent);">
                    <h3 style="color: var(--gold-accent);">Gemini Advanced</h3>
                    <div class="service-price">$15 <span>/ 18 شهر</span></div>
                    <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem;">يتم خصم المبلغ من رصيد المحفظة وتفعيل الاشتراك فوراً.</p>
                    <button class="btn-buy" style="border-color: var(--gold-accent);">شراء الآن</button>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
